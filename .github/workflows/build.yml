name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: tools
      - name: Check helper and plugin versions match
        run: |
          set -euo pipefail
          helper="$(jq -r '.version' tools/package.json)"
          plugin="$(jq -r '.version' .claude-plugin/plugin.json)"
          if [ "$helper" != "$plugin" ]; then
            echo "version mismatch: tools/package.json is $helper, .claude-plugin/plugin.json is $plugin" >&2
            echo "The release workflow writes one version to both; reseed them to match before releasing." >&2
            exit 1
          fi
          echo "helper and plugin versions match: $helper"
      - name: Test
        run: npm test
        working-directory: tools
      - name: Lint
        run: npm run lint
        working-directory: tools
      - name: Typecheck
        run: npm run typecheck
        working-directory: tools
      - name: Build helper
        run: npm run build
        working-directory: tools
        env:
          CI: "true"
      - name: Smoke test generated helper
        run: ./tools/dist/qrspi-x.mjs --version
      # The skills require Node 22+; run the bundle on the oldest supported runtime.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Smoke test generated helper on Node 22
        run: |
          node --version
          ./tools/dist/qrspi-x.mjs --version
          ./tools/dist/qrspi-x.mjs report --feature smoke-test --project .
